<svg width="720" height="1100" viewBox="0 0 720 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d9a8"/>
      <stop offset="50%" stop-color="#c9a86a"/>
      <stop offset="100%" stop-color="#f0d9a8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fe0ff"/>
      <stop offset="100%" stop-color="#2a8fd0"/>
    </linearGradient>
    <radialGradient id="shieldFill" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1a3a55"/>
      <stop offset="100%" stop-color="#08131c"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16324a"/>
      <stop offset="70%" stop-color="#0a1620"/>
      <stop offset="100%" stop-color="#050a0e"/>
    </radialGradient>
    <conicGradient id="ringGrad"/>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="1100" fill="#07070a"/>

  <g transform="translate(360,235)" filter="url(#softGlow)">
    <path d="M0 -110 L120 -70 V-10 C120 60 65 105 0 135 C-65 105 -120 60 -120 -10 V-70 Z"
          fill="url(#shieldFill)" stroke="url(#gold)" stroke-width="4"/>
    <path d="M-60 5 L-25 5 L-5 -35 L20 45 L40 -15 L55 5 L85 5"
          fill="none" stroke="url(#blue)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 -55 C80 -55 100 -45 112 -25" fill="none" stroke="url(#blue)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <path d="M72 -75 C100 -75 128 -60 148 -32" fill="none" stroke="url(#blue)" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <path d="M84 -95 C122 -95 158 -75 182 -40" fill="none" stroke="url(#blue)" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
  </g>

  <text x="360" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="64"
        font-weight="700" fill="none" stroke="url(#gold)" stroke-width="2.5" letter-spacing="10">SENTINEL</text>

  <text x="360" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="26"
        fill="#a9a9b3">Advanced Protection System</text>

  <g transform="translate(360,522)">
    <circle cx="-95" cy="-6" r="9" fill="#7ed957"/>
    <text x="-70" y="2" font-family="Arial, sans-serif" font-size="22" fill="#c7c7cf">Status: Monitorando em Segundo</text>
  </g>

  <g transform="translate(360,740)">
    <circle r="260" fill="none" stroke="#1c2530" stroke-width="1"/>
    <circle r="225" fill="none" stroke="url(#blue)" stroke-width="2" stroke-dasharray="3 6" opacity="0.5" filter="url(#softGlow)"/>
    <circle r="225" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="3 6" opacity="0.4"
            transform="rotate(30)"/>
    <circle r="190" fill="none" stroke="url(#blue)" stroke-width="3" opacity="0.6"/>
    <path d="M -190 0 A190 190 0 0 1 190 0" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.7" filter="url(#strongGlow)"/>
    <path d="M -190 0 A190 190 0 0 0 190 0" fill="none" stroke="url(#blue)" stroke-width="4" opacity="0.7" filter="url(#strongGlow)"/>
    <circle r="155" fill="none" stroke="#3a4a58" stroke-width="1.5"/>
    <circle r="155" r2="0" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="2 10" opacity="0.6"/>

    <g stroke="url(#blue)" stroke-width="2" opacity="0.7" filter="url(#softGlow)">
      <line x1="-260" y1="0" x2="-230" y2="0"/>
      <line x1="230" y1="0" x2="260" y2="0"/>
    </g>
    <polygon points="-225,0 -215,-6 -215,6" fill="url(#blue)" filter="url(#softGlow)"/>
    <polygon points="225,0 215,-6 215,6" fill="url(#blue)" filter="url(#softGlow)"/>
    <polygon points="0,-225 -6,-215 6,-215" fill="url(#gold)" filter="url(#softGlow)"/>
    <polygon points="0,225 -6,215 6,215" fill="url(#gold)" filter="url(#softGlow)"/>

    <circle r="120" fill="url(#centerGlow)" filter="url(#strongGlow)"/>
    <circle r="120" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>

    <g filter="url(#strongGlow)">
      <path d="M0 -70 L60 -45 V-5 C60 35 33 60 0 78 C-33 60 -60 35 -60 -5 V-45 Z"
            fill="#0b1420" stroke="url(#gold)" stroke-width="3"/>
      <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="30"
            font-weight="700" fill="#ffffff" letter-spacing="1">SOS</text>
    </g>

    <g fill="none" stroke="#6b7f8f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <g transform="translate(-235,-235)">
        <path d="M0 -10 C-6 -10 -10 -6 -10 0 C-10 8 0 16 0 16 C0 16 10 8 10 0 C10 -6 6 -10 0 -10 Z"/>
        <circle cx="0" cy="-1" r="3"/>
      </g>
      <g transform="translate(235,-235)">
        <path d="M-9 -6 L9 -6 L9 3 C9 8 5 11 0 11 C-5 11 -9 8 -9 3 Z"/>
        <path d="M-3 0 L1 4 L4 -4" stroke-width="2"/>
      </g>
      <g transform="translate(-235,235)">
        <path d="M0 8 C0 8 -10 0 -10 -6 C-10 -10 -6 -13 -2 -12 C-1 -12 0 -11 0 -10 C0 -11 1 -12 2 -12 C6 -13 10 -10 10 -6 C10 0 0 8 0 8 Z"/>
      </g>
      <g transform="translate(235,235)">
        <line x1="-9" y1="-9" x2="9" y2="-9"/>
        <line x1="-9" y1="-2" x2="9" y2="-2"/>
        <line x1="-9" y1="5" x2="3" y2="5"/>
      </g>
    </g>
  </g>

  <text x="360" y="1035" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#75757d">
    <tspan x="360" dy="0">Dica: Chacoalhe o dispositivo vigorosamente para ativar</tspan>
    <tspan x="360" dy="28">o alerta silencioso.</tspan>
  </text>
</svg>
